[pytest]
testpaths = tests
addopts = -x --tb=short
markers =
    phase3_required: release-blocking Phase 3 test; must pass offline with zero skips or xpasses
    live: explicit live-provider release test; excluded from ordinary offline CI and never replay-backed
    model: real cached embedding/reranker model test; excluded from ordinary offline CI and required in the release environment
    gpu: requires a CUDA GPU and the pinned ColQwen/torch/qdrant stack; excluded from the Phase 3 text release gate
