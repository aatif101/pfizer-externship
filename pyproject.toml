[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pfizer-sdf-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.72.0,<3.0",
    "pypdfium2>=5.0",
    "langfuse>=3.0,<4.0",
    "streamlit>=1.56,<2.0",
    "pydantic>=2.8",
    "pydantic-settings",
    "typer>=0.12",
    "tqdm>=4.66",
    "loguru>=0.7",
    "tenacity>=8.2",
    "python-dateutil",
    "psutil",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"