[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pfizer-sdf-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.72.0,<3.0",
    "pypdfium2>=5.0",
    "langfuse>=3.0,<4.0",
    "streamlit>=1.56,<2.0",
    "pydantic>=2.8",
    "pydantic-settings",
    "google-genai>=1.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "loguru>=0.7",
    "tenacity>=8.2",
    "python-dateutil",
    "psutil",
    "Pillow",
    # ragas 0.4.3 requires the langchain 0.3.x stack (langchain 1.x removed the
    # ChatVertexAI / ContextOverflowError symbols ragas imports at load time).
    "ragas==0.4.3",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<1",
    "langchain-google-genai>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
markers = [
    "gpu: requires a CUDA GPU + the pinned ColQwen/torch/qdrant stack; skipped offline",
]